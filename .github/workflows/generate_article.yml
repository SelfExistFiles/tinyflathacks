name: Auto Generate Hugo Article

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'  # 每天 UTC 09:00 运行

jobs:
  generate-and-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openai requests

      - name: Generate Article & Download Image
        env:
          ANYROUTER_API_KEY: ${{ secrets.ANYROUTER_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python .github/scripts/generate_article.py

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain content/posts/ static/images/) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: "chore: auto-generate new hugo article via AnyRouter Claude & Unsplash"
          title: "🤖 新文章已生成 (Claude 驱动)：请审核并合并"
          body: |
            此 PR 由 GitHub Actions 自动生成：
            - **文章内容**：由 AnyRouter Claude 3.5 Sonnet 驱动生成
            - **文章配图**：由 Unsplash 自动匹配获取并保存至 `static/images/`
            
            请人工检查文本质量与图片契合度后予以合并。
          branch: "auto-gemini-article"
          base: "main"
          add-paths: |
            content/posts/
            static/images/
          delete-branch: true
